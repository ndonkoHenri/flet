name: macOS Integration Tests

on:
  pull_request:
    paths:
      - '.github/workflows/macos-integration-tests.yml'
      - 'sdk/python/packages/flet/src/**'
      - 'sdk/python/packages/flet/integration_tests/**'
      - 'packages/flet/**'
      - 'client/**'
      - '.fvmrc'
  workflow_dispatch:
    inputs:
      launch:
        description: "How each test starts the app"
        type: choice
        options:
          - prebuilt
          - flutter-test
        default: prebuilt
      suites:
        description: "JSON list of suites to run"
        default: '["apps","examples/apps","examples/controls/core","examples/controls/cupertino","examples/controls/material","examples/extensions","controls/core","controls/cupertino","controls/material","controls/services","controls/theme","extensions"]'
      verbose:
        description: "Stream the Flutter output of every launch"
        type: boolean
        default: false
      job:
        description: "What to run: the suites, or the seeded failures"
        type: choice
        options:
          - suites
          - seeded
        default: suites
      crash_dialog:
        description: "CrashReporter DialogType in the seeded job"
        type: choice
        options:
          - none
          - default
        default: none
      note:
        description: "Free text for the run name"
        default: ""

run-name: "Guards: ${{ inputs.job }}, ${{ inputs.launch }}${{ inputs.verbose && ' (verbose)' || '' }} ${{ inputs.note }}"

env:
  FLET_TEST_SCREENSHOTS_PIXEL_RATIO: "2.0"
  FLET_TEST_SCREENSHOTS_SIMILARITY_THRESHOLD: "99.0"
  FLET_TEST_DISABLE_FVM: "1"
  UV_PYTHON: "3.13"
  FLET_TEST_VERBOSE: ${{ inputs.verbose && '1' || '0' }}

jobs:
  test-macos:
    if: inputs.job != 'seeded'
    runs-on: macos-26
    timeout-minutes: ${{ inputs.launch == 'flutter-test' && 330 || 60 }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(inputs.suites) }}

    name: ${{ matrix.suite }} Integration Tests
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Setup uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: ${{ !startsWith(github.ref, 'refs/tags/') }}

      - name: Setup Flutter
        uses: kuhnroyal/flutter-fvm-config-action/setup@c378498f1d1962d33039c3989411093ef8a17b2c # v3.3
        with:
          path: '.fvmrc'
          cache: ${{ !startsWith(github.ref, 'refs/tags/') }}

      - name: Show tool versions
        run: |
          uv --version && uv run python --version && pod --version && flutter --version

      - name: Show macOS display resolution
        run: |
          system_profiler SPDisplaysDataType | grep Resolution || true
          screencapture /tmp/screen.png
          sips -g pixelWidth -g pixelHeight /tmp/screen.png

      # A crashed app otherwise leaves a "quit unexpectedly" dialog on the
      # screen, in front of the apps of the tests that follow.
      - name: Disable the crash report dialog
        run: defaults write com.apple.CrashReporter DialogType none

      - name: Build integration test app
        if: inputs.launch != 'flutter-test'
        working-directory: client
        run: |
          flutter build macos --debug -t integration_test/app_test.dart
          echo "FLET_TEST_APP_BINARY=$PWD/build/macos/Build/Products/Debug/Flet.app/Contents/MacOS/Flet" >> "$GITHUB_ENV"

      - name: Run integration tests (${{ matrix.suite }})
        working-directory: sdk/python
        run: |
          uv run pytest -s -o log_cli=true -o log_cli_level=INFO packages/flet/integration_tests/${{ matrix.suite }}

      - name: Prepare failure screenshots
        if: failure()
        run: |
          SAFE_SUITE="${MATRIX_SUITE//\//-}"
          echo "SAFE_SUITE=$SAFE_SUITE" >> $GITHUB_ENV
        env:
          MATRIX_SUITE: ${{ matrix.suite }}

      - name: Upload artifact
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: integration-test-failures-macos-${{ env.SAFE_SUITE }}
          path: |
            sdk/python/packages/flet/integration_tests/${{ matrix.suite }}/**/*_actual.png
            sdk/python/packages/flet/integration_tests/${{ matrix.suite }}/**/*_actual.gif
          if-no-files-found: ignore

      - name: Upload crash reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: integration-test-crash-reports-macos-${{ env.SAFE_SUITE }}
          path: ~/Library/Logs/DiagnosticReports/
          if-no-files-found: ignore

  # Fork only: failures seeded on purpose, one pytest run each, checked
  # against the outcome expected in the chosen launch mode.
  seeded-failures:
    if: inputs.job == 'seeded'
    runs-on: macos-26
    timeout-minutes: ${{ inputs.launch == 'flutter-test' && 120 || 30 }}
    permissions:
      contents: read
    name: Seeded failures (${{ inputs.launch }})
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Setup uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: ${{ !startsWith(github.ref, 'refs/tags/') }}

      - name: Setup Flutter
        uses: kuhnroyal/flutter-fvm-config-action/setup@c378498f1d1962d33039c3989411093ef8a17b2c # v3.3
        with:
          path: '.fvmrc'
          cache: ${{ !startsWith(github.ref, 'refs/tags/') }}

      - name: Crash report dialog
        run: |
          echo "DialogType before: $(defaults read com.apple.CrashReporter DialogType 2>&1 | tail -1)"
          if [ "${{ inputs.crash_dialog }}" = "none" ]; then
            defaults write com.apple.CrashReporter DialogType none
          fi
          echo "DialogType now: $(defaults read com.apple.CrashReporter DialogType 2>&1 | tail -1)"
          ls -la ~/Library/Logs/DiagnosticReports/ 2>&1 | tail -5 || true

      - name: Build integration test app
        if: inputs.launch != 'flutter-test'
        working-directory: client
        run: |
          flutter build macos --debug -t integration_test/app_test.dart
          echo "FLET_TEST_APP_BINARY=$PWD/build/macos/Build/Products/Debug/Flet.app/Contents/MacOS/Flet" >> "$GITHUB_ENV"

      - name: Run seeded failures
        working-directory: sdk/python
        run: |
          uv run python packages/flet/seeded_failure_tests/run_seeds.py ${{ inputs.launch }}

      - name: Crash reports and screen after the run
        if: always()
        run: |
          sleep 15
          ls -la ~/Library/Logs/DiagnosticReports/ || true
          screencapture -x sdk/python/packages/flet/seeded_failure_tests/seed-logs/after-run.png || true
          pgrep -fl "Flet.app/Contents/MacOS/Flet|flutter_tools" || echo "no app or flutter tool process left"

      - name: Upload seed logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: seeded-failures-${{ inputs.launch }}
          path: sdk/python/packages/flet/seeded_failure_tests/seed-logs/
          if-no-files-found: ignore

      - name: Upload crash reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: seeded-failures-crash-reports-${{ inputs.launch }}
          path: ~/Library/Logs/DiagnosticReports/
          if-no-files-found: ignore
